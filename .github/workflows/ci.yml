name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'common.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore KargoApp.slnx

      - name: Build
        run: dotnet build KargoApp.slnx -c Release --no-restore

      # Testler in-memory SQLite kullanıyor; PostgreSQL/RabbitMQ/Redis gerekmez
      - name: Test
        run: dotnet test KargoApp.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Test sonuçları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
